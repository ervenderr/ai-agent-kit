[project]
name = "agent-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=1.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic-settings>=2.4",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "aiosqlite>=0.20",
  "ruff>=0.6",
  "pyright>=1.1.380",
]

[tool.ruff]
line-length = 120
[tool.ruff.lint]
per-file-ignores = { "tests/*" = ["E501"] }
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pyright]
include = ["app", "tests", "../../evals"]
extraPaths = [".", "../../evals"]
typeCheckingMode = "standard"
